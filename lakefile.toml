name = "noUniversalFSigma"
version = "0.1.0"
keywords = ["math", "descriptive set theory"]
defaultTargets = ["Solution"]

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
linter.style.longLine = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "NoUniversalFSigma"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
